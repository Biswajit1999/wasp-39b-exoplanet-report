name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/analyze_transit.py
      - run: python scripts/analyze_multisector.py
      - run: python scripts/analyze_atmospheric_evidence.py
      - run: python scripts/analyze_spectrum.py
      - run: python scripts/verify_data_provenance.py
      - run: python scripts/analyze_spectral_robustness.py
      - run: pytest tests/ -v
